<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- boton buscar -->
  <button id="btnBuscar" class="btn btn-primary">
    <i class="bi bi-search"></i>
    Buscar
  </button>

  <!-- inicio tarjeta -->
  <div class="card">
    <!-- Imagen del personaje -->
    <img src="https://placeholder.com" alt="Imagen del personaje" class="card-img">

    <!-- Cuerpo de la tarjeta -->
    <div class="card-body">
      <div class="card-header">
        <h2 class="card-title">Furius Dragon</h2>
        <span class="card-badge">Fuego</span>
      </div>

      <p class="card-description">Una criatura mítica que habita en las profundidades de los volcanes activos.</p>


      <div class="card-stats">
        <div class="stat-item">
          <span class="stat-label">🔥 Ataque</span>
          <span class="stat-value">85</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">🛡️ Defensa</span>
          <span class="stat-value">70</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">❤️ Vida (HP)</span>
          <span class="stat-value">120</span>
        </div>
      </div>
      <div class="container text-center">
        <div class="row align-items-start">
          <div class="col"><button type="button" id="btnAgregarFavoritos" class="btn boton-favoritos">
              <span class="estrella-favoritos">★</span>
              Agregar a favoritos
            </button></div>
          <div class="col"><button type="button" class="btn-solid theme-danger">
              <i class="bi bi-x-octagon-fill"></i>
              Eliminar
            </button></div>
        </div>
      </div>
    </div>
  </div>


  <!-- TODOS LOS POKEMON -->
  <section class="py-4">
    <h2 class="mb-3">Todos los Pokémon</h2>
    <div id="listaPokemones" class="container">
      <div class="row g-4" id="gridPokemones">
        <!-- Aquí el equipo inyectará las tarjetas de Pokémon -->
      </div>
    </div>
  </section>
  <!-- TODOS LOS POKEMON -->

  <!-- inicio seccion favoritos -->
  <section class="py-4">
    <h2 class="mb-3">Favoritos</h2>
    <div id="listaFavoritos" class="container">
      <div class="row g-4" id="gridFavoritos">
        <!-- Aquí el equipo inyectará las tarjetas de favoritos -->
      </div>
    </div>
  </section>
  <!-- fin seccion favoritos -->


  <!-- boton agregar favoritos
  <button type="button" id="btnAgregarFavoritos" class="btn boton-favoritos">
    <span class="estrella-favoritos">★</span>
    Agregar a favoritos
  </button> -->


  <!-- boton eliminar
  <button type="button" class="btn-solid theme-danger">
    <i class="bi bi-x-octagon-fill"></i>
    Eliminar
  </button> -->

  <!-- boton limpiar -->
  <button type="button" id="btnLimpiar" class="btn btn-outline-dark"> 🧹 Limpiar </button>

  <script>
    const inputPokemon = document.getElementById("inputPokemon");
    const btnLimpiar = document.getElementById("btnLimpiar");
    const resultadoBusqueda = document.getElementById("resultadoBusqueda");

    btnLimpiar.addEventListener("click", function () {
      inputPokemon.value = "";
      resultadoBusqueda.innerHTML = "";
    });
  </script>



  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>

</html>
