<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .mi-clase-muestra {
      background: yellow;
    }

    /* Contenedor principal de la tarjeta */
    .card {
      width: 280px;
      background-color: #ffffff;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      border: 1px solid #e0e0e0;
    }

    /* Imagen superior */
    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    /* Espaciado del contenido */
    .card-body {
      padding: 16px;
    }

    /* Encabezado: Nombre y Tipo en la misma línea */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .card-title {
      margin: 0;
      font-size: 1.4rem;
      color: #333;
    }

    /* Etiqueta de tipo (Badge) */
    .card-badge {
      background-color: #ff4757;
      color: white;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .card-description {
      font-size: 0.9rem;
      color: #666;
      margin: 0 0 16px 0;
      line-height: 1.4;
    }

    /* Sección de estadísticas */
    .card-stats {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #f0f0f0;
      padding-top: 12px;
    }

    /* Cada bloque de estadística individual */
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: bold;
      color: #2f3542;
    }
  </style>
</head>

<body>

  <div class="card">
    <!-- Imagen del personaje -->
    <img src="https://placeholder.com" alt="Imagen del personaje" class="card-img">

    <!-- Cuerpo de la tarjeta -->
    <div class="card-body">
      <div class="card-header">
        <h2 class="card-title">Furius Dragon</h2>
        <span class="card-badge">Fuego</span>
      </div>

      <p class="card-description">Una criatura mítica que habita en las profundidades de los volcanes activos.</p>

      <!-- Estadísticas y Atributos -->
      <div class="card-stats">
        <div class="stat-item">
          <span class="stat-label">🔥 Ataque</span>
          <span class="stat-value">85</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">🛡️ Defensa</span>
          <span class="stat-value">70</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">❤️ Vida (HP)</span>
          <span class="stat-value">120</span>
        </div>
      </div>
    </div>
  </div>






  <script src="script.js"></script>
</body>

</html>
